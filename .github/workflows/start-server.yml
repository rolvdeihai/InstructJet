name: Start AI Server

on:
  workflow_dispatch:
  repository_dispatch:
    types: [start-server]

jobs:
  run-server:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies (with prebuilt llama-cpp-python)
        working-directory: ./jet-ai
        run: |
          python -m pip install --upgrade pip
          
          # Install prebuilt llama-cpp-python wheel from GitHub release
          WHEEL_URL="https://github.com/rolvdeihai/InstructJet/releases/download/v1.0/llama_cpp_python-0.3.20-py3-none-linux_x86_64.whl"
          pip install -U "$WHEEL_URL"
          
          # Install remaining requirements (if requirements.txt exists)
          if [ -f "requirements.txt" ]; then
            pip install -r requirements.txt
          else
            # Fallback: install common packages
            pip install fastapi uvicorn huggingface_hub psutil pyngrok sentence-transformers torch tiktoken sumy
          fi

      - name: Download NLTK punkt (for LexRank)
        working-directory: ./jet-ai
        run: |
          python -c "import nltk; nltk.download('punkt')"

      - name: Start server with ngrok
        working-directory: ./jet-ai
        env:
          NGROK_AUTH_TOKEN: ${{ secrets.NGROK_AUTH_TOKEN }}
        run: |
          python run_server.py